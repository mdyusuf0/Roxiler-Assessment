services:
  - type: web
    name: roxiler-store-rating-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: roxiler-store-db
          property: connectionString

databases:
  - name: roxiler-store-db
    databaseName: store_rating
    user: postgres
    plan: free
